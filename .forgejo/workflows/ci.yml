name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.6"

      - name: Tool versions
        run: |
          node --version
          npm --version

      - name: Syntax checks and unit tests
        run: npm run check

      - name: Verify publish contents
        run: npm pack --dry-run
