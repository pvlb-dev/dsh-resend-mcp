name: CI

# No pull_request trigger on purpose. This repository is public, and the
# single Forgejo runner gives job containers the host's rootless Docker socket;
# a fork PR workflow could reach the Forgejo environment. Only maintainers can
# push or dispatch, so those events are safe.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.6"

      - name: Tool versions
        run: |
          node --version
          npm --version

      - name: Syntax checks and unit tests
        run: npm run check

      - name: Verify publish contents
        run: npm pack --dry-run
